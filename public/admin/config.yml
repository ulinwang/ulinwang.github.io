# Decap CMS 配置
# 本地编辑：运行 `npx decap-server`，取消注释 local_backend，访问 http://localhost:3000/admin/
# 线上编辑：GitHub OAuth 已接入 app/api/auth 与 app/api/callback（配置步骤见 README）

# local_backend: true

backend:
  name: github
  repo: ulinwang/ulinwang.github.io
  branch: main
  base_url: https://youlinwang.vercel.app
  auth_endpoint: api/auth

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: 站点内容
    files:
      - name: intro
        label: 简介
        file: content/site/intro.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 正文, name: body, widget: markdown }
          - { label: 正文（英文）, name: body_en, widget: markdown, required: false }
      - name: about
        label: 关于我
        file: content/site/about.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: GitHub 链接, name: github, widget: string }
          - { label: 邮箱, name: email, widget: string }
          - { label: 小红书链接, name: xhs, widget: string }
          - { label: 正文, name: body, widget: markdown }
          - { label: 正文（英文）, name: body_en, widget: markdown, required: false }

  - name: projects
    label: 作品集
    folder: content/projects
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: [order, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 标题（英文）, name: title_en, widget: string, required: false }
      - { label: 描述, name: description, widget: text }
      - { label: 描述（英文）, name: description_en, widget: text, required: false }
      - label: 标签
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - { label: 链接, name: link, widget: string, required: false }
      - { label: 精选, name: featured, widget: boolean, default: false }
      - { label: 排序, name: order, widget: number, default: 99 }
      - { label: 画布坐标 X, name: x, widget: number, default: 0 }
      - { label: 画布坐标 Y, name: y, widget: number, default: 0 }
      - { label: 正文, name: body, widget: markdown }

  - name: experience
    label: 工作经历
    folder: content/experience
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: [order, company]
    fields:
      - { label: 公司, name: company, widget: string }
      - { label: 公司（英文）, name: company_en, widget: string, required: false }
      - { label: 职位, name: role, widget: string }
      - { label: 职位（英文）, name: role_en, widget: string, required: false }
      - { label: 时间段, name: period, widget: string }
      - { label: 排序, name: order, widget: number, default: 99 }
      - { label: 工作内容, name: body, widget: markdown }

  - name: education
    label: 教育经历
    folder: content/education
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: [order, school]
    fields:
      - { label: 学校, name: school, widget: string }
      - { label: 学校（英文）, name: school_en, widget: string, required: false }
      - { label: 学位, name: degree, widget: string }
      - { label: 学位（英文）, name: degree_en, widget: string, required: false }
      - { label: 时间段, name: period, widget: string }
      - { label: 排序, name: order, widget: number, default: 99 }
      - { label: 详情, name: body, widget: markdown }
